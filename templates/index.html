<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Guide Generator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E📄%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles/upload.css" />
</head>
<body data-upload-api-base-url="{{ upload_api_base_url | e }}">
<div class="container">

  <div class="top-brand" aria-label="iSchool brand">
    <img src="/static/assets/iSchool.png" alt="iSchool" class="top-brand-logo" />
  </div>

  <!-- Upload Card -->
  <div class="card">
    <div class="card-head">
      <h1>Teacher Guide Generator</h1>
      <p>Upload your PDF and generate an editable teaching guide.</p>
    </div>

    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept=".pdf" aria-label="Upload PDF file" title="Upload PDF file" />
      <div class="dropzone-icon">&#128193;</div>
      <p><strong>Click to browse</strong> or drag &amp; drop here</p>
      <small>Accepted: .pdf files only</small>
      <span id="file-label"></span>
    </div>

    <!-- <div class="file-chip" id="file-chip" hidden aria-live="polite">
      <span class="file-chip-name" id="file-chip-name"></span>
      <span class="file-chip-size" id="file-chip-size"></span>
    </div> -->

    <div class="alert alert-error" id="error-box"></div>

    <div class="spinner-wrap" id="spinner">
      <div class="spinner"></div>
      <p class="spinner-msg" id="spinner-msg">Uploading file...</p>
    </div>

    <div class="btn-stack">
      <button class="btn btn-full btn-main" id="generate-btn" data-default-label="Generate">
        <span class="btn-icon" aria-hidden="true">&#9889;</span>
        <span class="btn-copy">
          <span class="btn-title" id="generate-btn-title">Generate</span>
        </span>
      </button>
      <button class="btn btn-full import-guide-btn" id="import-guide-btn" type="button">
        <span class="btn-icon" aria-hidden="true">&#128194;</span>
        <span class="btn-copy">
          <span class="btn-title">Import from HTML</span>
        </span>
      </button>
    </div>
    <input type="file" id="import-guide-input" accept="text/html" hidden />
  </div>

  <!-- Floating success toast -->
  <div id="success-toast" class="success-toast" role="status" aria-live="polite" aria-atomic="true">
    <div class="success-toast-icon" aria-hidden="true">&#10003;</div>
    <div class="success-toast-copy">
      <p class="success-toast-title" id="success-title">Teacher Guide generated successfully</p>
      <p class="success-toast-sub">Opening the editor...</p>
    </div>
    <button class="success-toast-action" id="open-editor-btn" type="button">Open Editor</button>
  </div>

  <!-- <p class="footer">Powered by iSchool</p> -->

</div>

<script src="/static/app.js"></script>
</body>
</html>
